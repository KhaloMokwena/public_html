{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-8">
        <div class="card bg-dark text-light border-secondary p-4 shadow-sm">
            <h1 class="fw-bold text-info mb-3">{{ record.title }}</h1>
            <p class="text-muted small">Published on {{ record.created_at|date:"F d, Y H:i" }}</p>
            
            {% if record.image %}
                <div class="mb-4">
                    <img src="{{ record.image.url }}" class="img-fluid rounded border border-secondary" alt="{{ record.title }}">
                </div>
            {% endif %}
            
            <div class="card-text fs-5 text-light mb-4" style="white-space: pre-wrap;">{{ record.description }}</div>
            
            <div class="d-flex justify-content-between">
                <a href="{% url 'home' %}" class="btn btn-outline-secondary">&larr; Back to Home</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'record_edit' record.id %}" class="btn btn-primary">Edit This Item</a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
